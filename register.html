<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a Fenwanovels AfriTales account.">
  <title>Create account | Fenwanovels</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script type="module" src="assets/js/ui.js"></script>
  <script type="module" src="assets/js/auth-page.js"></script>
</head>
<body class="auth-page" data-auth-mode="register">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="simple-header">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">F</span><span><strong>Fenwanovels</strong><small>AfriTales</small></span></a>
    <button class="icon-button" type="button" data-theme-toggle aria-label="Switch colour theme">Theme</button>
  </header>
  <main id="main-content" class="auth-shell">
    <section class="auth-card" aria-labelledby="auth-title">
      <p class="eyebrow">Reader account</p>
      <h1 id="auth-title">Create your account</h1>
      <p class="muted">Use a valid email address. Passwords must contain at least six characters.</p>
      <form id="auth-form" novalidate>
        <label for="name">Display name</label>
        <input id="name" name="name" type="text" autocomplete="name" minlength="2" maxlength="80" required>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
        <button class="button primary full-width" type="submit">Create account</button>
      </form>
      <p id="auth-status" class="status" role="status" aria-live="polite"></p>
      <p class="auth-switch">Already registered? <a href="login.html">Log in</a></p>
    </section>
  </main>
</body>
</html>
