<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Log in to Fenwanovels AfriTales.">
  <title>Log in | Fenwanovels</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script type="module" src="assets/js/ui.js"></script>
  <script type="module" src="assets/js/auth-page.js"></script>
</head>
<body class="auth-page" data-auth-mode="login">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="simple-header">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">F</span><span><strong>Fenwanovels</strong><small>AfriTales</small></span></a>
    <button class="icon-button" type="button" data-theme-toggle aria-label="Switch colour theme">Theme</button>
  </header>
  <main id="main-content" class="auth-shell">
    <section class="auth-card" aria-labelledby="auth-title">
      <p class="eyebrow">Welcome back</p>
      <h1 id="auth-title">Log in to your account</h1>
      <p class="muted">Your account will hold your wallet balance and chapter access after the secure backend is configured.</p>
      <form id="auth-form" novalidate>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>
        <button class="button primary full-width" type="submit">Log in</button>
      </form>
      <p id="auth-status" class="status" role="status" aria-live="polite"></p>
      <p class="auth-switch">New to Fenwanovels? <a href="register.html">Create an account</a></p>
    </section>
  </main>
</body>
</html>
